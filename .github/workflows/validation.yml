name: KaliSU OP13R full GKI2 canary

on:
  workflow_dispatch:
  push:
    branches:
      - validation-canary
    paths:
      - .github/workflows/validation.yml
      - .github/actions/build-kalisu-op13r/**
      - .github/actions/kernel-source-sync/**
      - kalisu/**
      - manifests/a16/oneplus_13r_6.1.157_w.xml

permissions:
  contents: write

concurrency:
  group: kalisu-op13r-full-gki2-${{ github.ref }}
  cancel-in-progress: false

env:
  KALISU_SOURCE_COMMIT: d1a0836256189898bd4738263e8c64a60e497788
  KALISU_CERT_SIZE: 0x53b
  KALISU_CERT_SHA256: d8ed664c1c83cf2a49ee45f3c1e6cecdc7ecc2697fcb877db03ecd70713aa546
  SUSFS_COMMIT: f76b81f2a6bf98e4029cc0c823c054edbec29803
  EXPECTED_ZIP: KaliSU-AK3_OP13r_OOS16_android14-6.1.157_30000_Bridge1_SuSFS_v2.4.0.zip
  RELEASE_TAG: kalisu-op13r-full-gki2-v1

jobs:
  build:
    name: Native KaliSU + Bridge + SuSFS 2.4.0
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout canary controller
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Declare physical-test boundary
        shell: bash
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## KaliSU OP13R full GKI 2.0 canary

          This replaces the failed minimal native candidate. It uses the full
          OnePlus 13R GKI build/config/package path represented by the supplied
          BakaSU/Fatal kernels, but the root core, manager identity and bridge
          are KaliSU-owned.

          A green workflow proves compilation and static contract checks only.
          It does **not** mean this Image booted on the physical OnePlus 13R.
          EOF

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip dwarves file python3 ccache jq bc \
            dos2unix kmod libdw-dev elfutils pigz zip patch aria2 cpio zstd

      - name: Verify KaliSU manager and Bridge pins
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg commit "$KALISU_SOURCE_COMMIT" \
                --arg size "$KALISU_CERT_SIZE" \
                --arg hash "$KALISU_CERT_SHA256" \
            '.product == "KaliSU" and .version == "3.0.0" and
             .version_code == 30000 and .source_commit == $commit and
             .manager_certificate_size == $size and
             .manager_certificate_sha256 == $hash and
             .bridge_abi == 1 and .uapi_version == 7' \
            kalisu/source.json >/dev/null
          grep -qF 'KSU_VERSION_FULL := v3.0.0-d1a08362@KaliSU' kalisu/Kbuild
          grep -qF 'KSU_PACKAGE_NAME ?= com.nostalgicmultiverse.kalisu.manager' kalisu/Kbuild
          grep -qF 'KSU_EXPECTED_SIZE ?= 0x53b' kalisu/Kbuild
          grep -qF "KSU_EXPECTED_HASH ?= $KALISU_CERT_SHA256" kalisu/Kbuild
          grep -qF 'kalisu-objs += bridge/kalisu_bridge.o' kalisu/Kbuild
          grep -qF 'KALISU_IOCTL_BRIDGE' kalisu/supercall/dispatch.c
          grep -qF '.perm_check = only_manager' kalisu/supercall/dispatch.c
          grep -qF 'revision="7a7ae28e849b0f9b42b8b6fc26feebe1864bf7ac"' \
            manifests/a16/oneplus_13r_6.1.157_w.xml
          grep -qF 'revision="dda73f7205501c09f7d0f48fd5f6d7f4b2220ca7"' \
            manifests/a16/oneplus_13r_6.1.157_w.xml

      - name: Prepare full OP13R feature configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/op13r.json <<'EOF'
          {
            "model":"OP13r-6.1.157",
            "soc":"pineapple",
            "branch":"wild/sm8650",
            "manifest":"oneplus_13r_6.1.157_w.xml",
            "android_version":"android14",
            "kernel_version":"6.1",
            "os_version":"OOS16",
            "lto":"thin",
            "zyc_compiler":"",
            "c_compiler":"kernel_platform/prebuilts/clang/host/linux-x86/clang-r487747c/bin",
            "rust_compiler":"",
            "bindgen":"",
            "rust_build":false,
            "disk_cleanup":false,
            "hmbird":false,
            "susfs":true,
            "susfs_version":"2.4.0",
            "susfs_family":"android14-6.1",
            "susfs_commit":"f76b81f2a6bf98e4029cc0c823c054edbec29803",
            "opt":true,
            "ds":true,
            "bbg":true,
            "bbr":true,
            "bbr3":true,
            "ttl":true,
            "ip_set":true,
            "unicode":true,
            "ntsync":true,
            "wireguard":false,
            "blacklist_modules":"kernelsu,oplus_security_guard,oplus_qr_scan,oplus_score,oplus_vip_task,oplus_dns_cache,oplus_network_linkpower_module,oplus_data_module,oplus_secure_harden,oplus_security_keventupload,oplus_secure_guard_new,oplus_secure_guard,coresight_tpda,coresight_tgu,coresight_trace_noc,coresight_cti,coresight_qmi,coresight_dummy,coresight_remote_etm,coresight_tpdm,coresight_uetm,coresight_stm,coresight_tmc_sec,f_fs_ipc_log,qcom_iommu_debug,qti_battery_debug,rdbg,stm_heartbeat,stm_p_ost,stm_core,stm_ftrace,stm_console,spmi_pmic_arb_debug",
            "uname":"OP-KALISU"
          }
          EOF
          echo "json=$(jq -c . /tmp/op13r.json)" >> "$GITHUB_OUTPUT"

      - name: Build full KaliSU GKI2 candidate
        id: build
        uses: ./.github/actions/build-kalisu-op13r
        with:
          op_config_json: ${{ steps.config.outputs.json }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ksu_type: KaliSU
          ksu_branch_or_hash: ${{ env.KALISU_SOURCE_COMMIT }}
          susfs_commit_hash_or_branch: ${{ env.SUSFS_COMMIT }}
          use_nomount: false
          optimize_level: O2
          gaming_profile: false
          clean: false
          debug: false

      - name: Audit manager recognition, Bridge and SuSFS
        id: audit
        shell: bash
        env:
          ZIP_NAME: ${{ steps.build.outputs.zip_name }}
          KERNEL_VERSION: ${{ steps.build.outputs.kernel_version }}
          KSU_VERSION: ${{ steps.build.outputs.ksu_version }}
          SUSFS_VERSION: ${{ steps.build.outputs.susfs_version }}
        run: |
          set -euo pipefail
          test "$KERNEL_VERSION" = "android14-6.1.157"
          test "$KSU_VERSION" = "30000-bridge1"
          test "$SUSFS_VERSION" = "v2.4.0"
          test "$ZIP_NAME" = "$EXPECTED_ZIP"

          zip_path=$(find "$GITHUB_WORKSPACE" -type f -name "$EXPECTED_ZIP" -print -quit)
          test -n "$zip_path"
          unzip -t "$zip_path" >/dev/null
          unzip -p "$zip_path" Image > /tmp/kalisu-op13r-Image
          test -s /tmp/kalisu-op13r-Image
          file /tmp/kalisu-op13r-Image | grep -qi 'Linux kernel ARM64 boot executable Image'
          strings -a /tmp/kalisu-op13r-Image > /tmp/kalisu-op13r-strings

          grep -Fq 'v3.0.0-d1a08362@KaliSU' /tmp/kalisu-op13r-strings
          grep -Fq 'com.nostalgicmultiverse.kalisu.manager' /tmp/kalisu-op13r-strings
          grep -Fq "$KALISU_CERT_SHA256" /tmp/kalisu-op13r-strings
          grep -Fq 'KaliSU Bridge v%u diagnostic endpoint ready' /tmp/kalisu-op13r-strings
          grep -Fq 'KALISU_BRIDGE' /tmp/kalisu-op13r-strings
          grep -Fq 'susfs is initialized! version: v2.4.0' /tmp/kalisu-op13r-strings
          grep -Fq 'CONFIG_KSU_SUSFS_SPOOF_UNAME' /tmp/kalisu-op13r-strings
          grep -Fq 'CONFIG_KSU_SUSFS_OPEN_REDIRECT' /tmp/kalisu-op13r-strings

          # Match the physically booted huangdihd/BakaSU GKI2 packaging
          # boundary: replace only boot's Image and do not install, delete or
          # rewrite any vendor modules.  The OnePlus blacklist is retained as
          # policy input, but it is not an AnyKernel module operation.
          unzip -p "$zip_path" anykernel.sh > /tmp/kalisu-anykernel.sh
          grep -Eq '^block=boot$' /tmp/kalisu-anykernel.sh
          grep -Eq '^do\.modules=0$' /tmp/kalisu-anykernel.sh
          grep -Fq 'split_boot' /tmp/kalisu-anykernel.sh
          if unzip -Z1 "$zip_path" | grep -Eq '(^|/)modules/|\.ko$'; then
            echo '::error::GKI2 ZIP must not carry or mutate vendor modules'
            exit 1
          fi

          if grep -qiE 'com\.resukisu\.resukisu|d3469712b6214462764a1d8d3e5cbe1d6819a0b629791b9f4101867821f1df64|OP-BAKASU|huangdihd' /tmp/kalisu-op13r-strings; then
            echo '::error::BakaSU/ReSukiSU manager identity leaked into KaliSU Image'
            exit 1
          fi
          if grep -qiE 'KernelSU-Next|OP-WILD|fatalcoder' /tmp/kalisu-op13r-strings; then
            echo '::error::Foreign root/kernel identity leaked into KaliSU Image'
            exit 1
          fi

          image_sha256=$(sha256sum /tmp/kalisu-op13r-Image | awk '{print $1}')
          zip_sha256=$(sha256sum "$zip_path" | awk '{print $1}')
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "image_sha256=$image_sha256" >> "$GITHUB_OUTPUT"
          echo "zip_sha256=$zip_sha256" >> "$GITHUB_OUTPUT"

      - name: Publish unbooted full-GKI2 prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP_PATH: ${{ steps.audit.outputs.zip_path }}
          IMAGE_SHA256: ${{ steps.audit.outputs.image_sha256 }}
          ZIP_SHA256: ${{ steps.audit.outputs.zip_sha256 }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          cat > "$notes" <<EOF
          Full KaliSU GKI 2.0 canary for OnePlus 13R CPH2691,
          OOS 16.0.10.600(EX01), android14-6.1.157.

          IMPORTANT: UNBOOTED / PHYSICAL DEVICE TEST REQUIRED.
          A successful Actions run proves compilation and static audits only.

          - Root core: KaliSU 3.0.0 / 30000 at $KALISU_SOURCE_COMMIT
          - KaliSU Bridge: authenticated ABI 1, UAPI 7
          - Manager certificate: $KALISU_CERT_SHA256 (size $KALISU_CERT_SIZE)
          - Randomized manager packages: authorized by certificate fallback
          - SuSFS: v2.4.0 at $SUSFS_COMMIT, full nine-capability integration
          - BakaSU/KernelSU-Next identity substitution: none
          - NoMount: excluded
          - clean=false with reusable ccache
          - Image SHA-256: $IMAGE_SHA256
          - ZIP SHA-256: $ZIP_SHA256

          The earlier native baseline failed to boot and is not evidence for this
          candidate. Keep the stock boot image ready for recovery.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --prerelease \
              --title 'KaliSU OP13R full GKI2 v1 - UNBOOTED' \
              --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" --prerelease --target "${{ github.sha }}" \
              --title 'KaliSU OP13R full GKI2 v1 - UNBOOTED' \
              --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" "$ZIP_PATH#$EXPECTED_ZIP" --clobber

      - name: Record provenance
        shell: bash
        env:
          IMAGE_SHA256: ${{ steps.audit.outputs.image_sha256 }}
          ZIP_SHA256: ${{ steps.audit.outputs.zip_sha256 }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF

          ### Result

          - Build/static audit: passed
          - Physical boot status: **UNTESTED**
          - KaliSU source: `$KALISU_SOURCE_COMMIT`
          - KaliSU manager certificate: `$KALISU_CERT_SHA256`
          - SuSFS 2.4.0: `$SUSFS_COMMIT`
          - OnePlus common source: `7a7ae28e849b0f9b42b8b6fc26feebe1864bf7ac`
          - Modules/devicetree source: `dda73f7205501c09f7d0f48fd5f6d7f4b2220ca7`
          - Stock boot SHA-256: `a7bd7452ccf0f0c98057394c56406b74bf65d55c69bad8ec37b1e440c5568710`
          - Built Image SHA-256: `$IMAGE_SHA256`
          - Flashable ZIP SHA-256: `$ZIP_SHA256`
          EOF
