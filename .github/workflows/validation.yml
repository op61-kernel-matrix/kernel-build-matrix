name: Validation canary

on:
  workflow_dispatch:
  push:
    branches:
      - validation-canary
    paths:
      - .github/workflows/validation.yml
      - .github/actions/kernel-source-sync/**
      - manifests/a16/oneplus_13r_6.1.157_w.xml

permissions:
  contents: write

concurrency:
  group: validation-canary-${{ github.ref }}
  cancel-in-progress: false

env:
  CONFIG: OP13r-6.1.157
  OP_MODEL: OP13r-6.1.157
  OP_BRANCH: wild/sm8650
  OP_OS_VERSION: A16
  OP_MANIFEST: oneplus_13r_6.1.157_w.xml
  OP_ANDROID_VERSION: android14
  OP_KERNEL_VERSION: "6.1"
  OP_C_COMPILER: kernel_platform/prebuilts/clang/host/linux-x86/clang-r487747c/bin
  CLEAN_BUILD: "false"
  STOCK_LOCALVERSION: -android14-11-o-g00d81d97d759
  STOCK_BUILD_TIMESTAMP: Fri Aug 7 09:40:54 UTC 2026
  EXPECTED_ZIP: OP13R-A16-android14-6.1.157-plain-source-baseline.zip
  RELEASE_TAG: op13r-plain-source-baseline-v1

jobs:
  build:
    name: Plain OnePlus source - no-root boot canary
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout canary controller
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Declare isolation scope
        shell: bash
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## OP13R plain-source boot baseline

          The previous native KaliSU candidate was physically tested and did
          **not** boot. This replacement is deliberately a no-root isolation
          build. It contains no KaliSU/KernelSU, SuSFS, NoMount, fake-config,
          feature, gaming, or performance patch stack.

          This is a one-time diagnostic, not the requested final kernel. If it
          boots, the next canary adds only native KaliSU. If it does not boot,
          the source/config/toolchain path must be corrected before KaliSU can
          be evaluated.

          A green Actions run means compile/static audit only. It does not mean
          the OnePlus 13R booted this Image.
          EOF
          test "$CLEAN_BUILD" = "false"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential flex bison libelf-dev \
            libssl-dev libncurses-dev zlib1g-dev liblz4-tool libxml2-utils \
            rsync unzip dwarves file python3 ccache jq bc dos2unix kmod \
            libdw-dev elfutils pigz zip aria2 cpio zstd

      - name: Verify exact pinned OnePlus inputs
        shell: bash
        run: |
          set -euo pipefail
          manifest="manifests/a16/$OP_MANIFEST"
          grep -qF 'revision="7a7ae28e849b0f9b42b8b6fc26feebe1864bf7ac"' "$manifest"
          grep -qF 'revision="dda73f7205501c09f7d0f48fd5f6d7f4b2220ca7"' "$manifest"
          grep -qF 'revision="28b975ada54f8610ed531a6b57253aed10e7c87d"' "$manifest"
          grep -qF 'revision="0b46673ae91aee8d60bd6ee257b4d56d3f6a0114"' "$manifest"

      - name: Prepare source directory
        shell: bash
        run: mkdir -p "$CONFIG"

      - name: Sync pinned OnePlus source and toolchain
        uses: ./.github/actions/kernel-source-sync
        with:
          source_location: ${{ env.CONFIG }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          debug: false
          local_build: true

      - name: Restore warm compiler cache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: plain-op13r-6.1.157-r487747c-${{ github.run_id }}
          restore-keys: |
            plain-op13r-6.1.157-r487747c-

      - name: Build untouched no-root Image
        id: build
        shell: bash
        run: |
          set -euo pipefail
          common="$GITHUB_WORKSPACE/$CONFIG/kernel_platform/common"
          clang_bin="$GITHUB_WORKSPACE/$CONFIG/$OP_C_COMPILER"
          build_tools="$GITHUB_WORKSPACE/$CONFIG/kernel_platform/prebuilts/kernel-build-tools/linux-x86/bin"
          out="$common/out"

          test -x "$clang_bin/clang"
          test -f "$common/Makefile"
          export PATH="$clang_bin:$build_tools:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          export LLVM=1 LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export PAHOLE="$build_tools/pahole"
          export KBUILD_BUILD_USER=build-user
          export KBUILD_BUILD_HOST=build-host
          export KBUILD_BUILD_VERSION=1
          export KBUILD_BUILD_TIMESTAMP="$STOCK_BUILD_TIMESTAMP"
          export SOURCE_DATE_EPOCH=1786095654
          export CCACHE_DIR=/tmp/ccache
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_MAXSIZE=5G
          export CCACHE_COMPRESS=true
          export CCACHE_COMPRESSLEVEL=3
          mkdir -p "$CCACHE_DIR" "$out"
          ccache --zero-stats

          cd "$common"
          : > .scmversion
          cat > ld-wrapper <<'EOF'
          #!/bin/bash
          exec ld.lld "$@" --thinlto-jobs="$(nproc --all)"
          EOF
          chmod +x ld-wrapper

          make O="$out" LLVM=1 LLVM_IAS=1 \
            CC="ccache clang" HOSTCC="ccache clang" \
            LD="$common/ld-wrapper" HOSTLD="$common/ld-wrapper" \
            gki_defconfig

          scripts/config --file "$out/.config" \
            --set-str LOCALVERSION "$STOCK_LOCALVERSION" \
            -d LOCALVERSION_AUTO
          make O="$out" LLVM=1 LLVM_IAS=1 \
            CC="ccache clang" HOSTCC="ccache clang" \
            LD="$common/ld-wrapper" HOSTLD="$common/ld-wrapper" \
            olddefconfig

          grep -qxF 'CONFIG_LOCALVERSION="-android14-11-o-g00d81d97d759"' "$out/.config"
          grep -qxF '# CONFIG_LOCALVERSION_AUTO is not set' "$out/.config"
          grep -E '^CONFIG_(LTO|LTO_CLANG|LTO_CLANG_NONE|LTO_CLANG_THIN|LTO_CLANG_FULL)=' \
            "$out/.config" || true
          if grep -Eq '^CONFIG_(KSU|KSU_SUSFS|NOMOUNT)=' "$out/.config"; then
            echo '::error::A root or hiding engine entered the plain baseline config'
            grep -E '^CONFIG_(KSU|KSU_SUSFS|NOMOUNT)=' "$out/.config" >&2
            exit 1
          fi

          set -o pipefail
          make -j"$(nproc --all)" O="$out" LLVM=1 LLVM_IAS=1 \
            CC="ccache clang" HOSTCC="ccache clang" \
            LD="$common/ld-wrapper" HOSTLD="$common/ld-wrapper" \
            Image 2>&1 | tee build.log

          image="$out/arch/arm64/boot/Image"
          test -s "$image"
          file "$image" | grep -qi 'Linux kernel ARM64 boot executable Image'
          image_sha256=$(sha256sum "$image" | awk '{print $1}')
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "config=$out/.config" >> "$GITHUB_OUTPUT"
          echo "image_sha256=$image_sha256" >> "$GITHUB_OUTPUT"
          ccache --show-stats

      - name: Static audit plain baseline
        id: audit
        shell: bash
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          CONFIG_FILE: ${{ steps.build.outputs.config }}
        run: |
          set -euo pipefail
          strings -a "$IMAGE" > /tmp/plain-image-strings
          grep -Fq 'Linux version 6.1.157-android14-11-o-g00d81d97d759' /tmp/plain-image-strings
          grep -Fq 'build-user@build-host' /tmp/plain-image-strings
          grep -Fq '#1 SMP PREEMPT Fri Aug  7 09:40:54 UTC 2026' /tmp/plain-image-strings || \
            grep -Fq '#1 SMP PREEMPT Fri Aug 7 09:40:54 UTC 2026' /tmp/plain-image-strings
          if grep -qiE 'KaliSU|KernelSU|SUSFS_VERSION|CONFIG_KSU_SUSFS|NoMount' /tmp/plain-image-strings; then
            echo '::error::Root/hiding-engine identity found in the plain Image'
            grep -iEm 20 'KaliSU|KernelSU|SUSFS_VERSION|CONFIG_KSU_SUSFS|NoMount' /tmp/plain-image-strings >&2
            exit 1
          fi
          if grep -Eq '^CONFIG_(KSU|KSU_SUSFS|NOMOUNT)=' "$CONFIG_FILE"; then
            echo '::error::Root/hiding-engine Kconfig found in the plain build'
            exit 1
          fi

      - name: Package with proven OP13R AnyKernel3 path
        id: package
        shell: bash
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail
          ak3="$GITHUB_WORKSPACE/$CONFIG/AnyKernel3"
          artifacts="$GITHUB_WORKSPACE/artifacts"
          test -f "$ak3/anykernel.sh"
          test -f "$ak3/tools/ak3-core.sh"
          cp "$IMAGE" "$ak3/Image"
          AK3_FILE="$ak3/anykernel.sh" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["AK3_FILE"])
          lines = path.read_text().splitlines()
          for index, line in enumerate(lines):
              if line.startswith("kernel.string="):
                  lines[index] = "kernel.string=OP13R plain OnePlus source boot baseline"
                  break
          else:
              raise SystemExit("kernel.string missing from AnyKernel3")
          path.write_text("\n".join(lines) + "\n")
          PY

          grep -Fq 'block=boot' "$ak3/anykernel.sh"
          grep -Fq 'is_slot_device=auto' "$ak3/anykernel.sh"
          grep -Fq 'do.check_boot_version=1' "$ak3/anykernel.sh"
          mkdir -p "$artifacts"
          cd "$ak3"
          zip -r9 "$artifacts/$EXPECTED_ZIP" ./* \
            -x '*.git*' -x README.md -x "$EXPECTED_ZIP"
          unzip -t "$artifacts/$EXPECTED_ZIP" >/dev/null
          unzip -l "$artifacts/$EXPECTED_ZIP" | grep -qE '[[:space:]]Image$'
          zip_sha256=$(sha256sum "$artifacts/$EXPECTED_ZIP" | awk '{print $1}')
          echo "zip=$artifacts/$EXPECTED_ZIP" >> "$GITHUB_OUTPUT"
          echo "zip_sha256=$zip_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload plain baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPECTED_ZIP }}
          path: ${{ steps.package.outputs.zip }}
          compression-level: 0
          retention-days: 30

      - name: Publish unbooted no-root prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP_PATH: ${{ steps.package.outputs.zip }}
          IMAGE_SHA256: ${{ steps.build.outputs.image_sha256 }}
          ZIP_SHA256: ${{ steps.package.outputs.zip_sha256 }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          cat > "$notes" <<EOF
          Plain OnePlus-source boot-isolation candidate for OnePlus 13R CPH2691,
          OOS 16.0.10.600(EX01), android14-6.1.157.

          IMPORTANT: UNBOOTED / DEVICE TEST REQUIRED.
          A successful Actions run proves compile and static audit only.

          This candidate intentionally contains:
          - No KaliSU or other KernelSU implementation
          - No SuSFS
          - No NoMount
          - No fake-config, performance, gaming, or feature patch stack
          - Stock-shaped release: 6.1.157-android14-11-o-g00d81d97d759
          - OnePlus common source: 7a7ae28e849b0f9b42b8b6fc26feebe1864bf7ac
          - Modules/devicetree source: dda73f7205501c09f7d0f48fd5f6d7f4b2220ca7
          - Clang: r487747c
          - clean=false with reusable ccache
          - Image SHA-256: $IMAGE_SHA256
          - ZIP SHA-256: $ZIP_SHA256

          This must boot successfully before native KaliSU is reintroduced.
          Keep the stock boot image ready for recovery.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --prerelease \
              --title 'OP13R plain-source baseline v1 - UNBOOTED' \
              --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" --prerelease --target "${{ github.sha }}" \
              --title 'OP13R plain-source baseline v1 - UNBOOTED' \
              --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" "$ZIP_PATH#$EXPECTED_ZIP" --clobber

      - name: Record provenance and physical-test boundary
        shell: bash
        env:
          IMAGE_SHA256: ${{ steps.build.outputs.image_sha256 }}
          ZIP_SHA256: ${{ steps.package.outputs.zip_sha256 }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF

          ### Result

          - Build/static audit: passed
          - Physical boot status: **UNTESTED**
          - Isolation level: plain OnePlus source, no root/hiding engines
          - clean: `$CLEAN_BUILD`
          - Stock boot SHA-256: `a7bd7452ccf0f0c98057394c56406b74bf65d55c69bad8ec37b1e440c5568710`
          - Built Image SHA-256: `$IMAGE_SHA256`
          - Flashable ZIP SHA-256: `$ZIP_SHA256`
          EOF
